<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to The America Codes</title>
<noscript><meta http-equiv="refresh" content="0; url=https://www.theamericacodes.com/"></noscript>
<script>
  // Host is hard-coded; only the path, query and hash are carried over (no open redirect).
  location.replace("https://www.theamericacodes.com" + location.pathname + location.search + location.hash);
</script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0b; color: #f2f2f2; text-align: center; padding: 24px; }
  a { color: #f2f2f2; }
</style>
</head>
<body>
  <p>Taking you to <a href="https://www.theamericacodes.com/">www.theamericacodes.com</a>&hellip;</p>
</body>
</html>
